# Case mostrate nel calendario.
#
# Questo file è pubblico: contiene solo nomi (delle case, del bucket, dei file delle
# foto). Indirizzi dei portali, utenti, password, chiavi e la passphrase della pagina
# stanno nei secret di GitHub Actions (vedi README), mai qui.

title = "Calendario case"
timezone = "Europe/Rome"

# Anni futuri da leggere oltre a quello corrente.
years_ahead = 1

# Anni già chiusi da continuare a leggere, perché i loro conti (statistiche e P&L)
# restino nella pagina; e il primo anno da leggere in assoluto. Con questi valori nel
# 2027 la pagina mostra ancora il 2026, e non cerca mai dati precedenti al 2026.
years_back = 1
first_year = 2026

# Orari della casa: gli ospiti entrano dalle check_in ed escono entro le check_out.
# Nel calendario ogni soggiorno inizia e finisce esattamente a queste ore. Valgono per
# tutte le case; una casa con orari diversi li ridefinisce nel proprio blocco [[property]].
check_in = "15:00"
check_out = "11:00"

# Bucket privato di Cloudflare R2 con il foglio delle spese e le foto delle case (vedi
# README). Il nome non è un dato riservato: per leggere il bucket servono l'account e le
# chiavi, che stanno nei secret. Con il nome scritto qui, nel secret COSTS_R2_URL basta
# l'Account ID di Cloudflare.
bucket = "vassenasanta"

# Nota facoltativa mostrata in fondo alla pagina (finisce cifrata, ma qui è in chiaro).
# note = "Per usare una casa scrivi nel gruppo di famiglia."

# Foto di una casa (facoltativa, vedi README): sta nel bucket privato, mai qui. Di norma
# è il file `<id>.jpg`; se ha un altro nome lo dice `photo`. Una foto verticale viene
# tagliata in orizzontale attorno al punto indicato da `photo_focus`, in percentuale
# dall'alto (50 = a metà).

# Pannello di controllo (facoltativo, vedi README): in testa a ogni casa dice se il WiFi è
# online, se riscaldamento e raffrescamento sono accesi e, per la casa sul lago, quanto è
# alto il lago. `climate` elenca le app che comandano il clima della casa (source: airzone,
# daikin, vaillant) con il nome da mostrare; gli account stanno nei secret. `wifi` è solo il
# nome della connessione: che sia online lo dicono le unità del clima, che ci passano
# attraverso. `lake` è il lago da sorvegliare (dati pubblici di laghi.net) con le due soglie,
# in centimetri sopra lo zero idrometrico: sopra `attention_cm` il pannello avvisa, sopra
# `alarm_cm` è allarme; in entrambi i casi il proprietario riceve una mail da GitHub.

[[property]]
id = "santa"
label = "Santa"
env = "SANTA"      # secret: SANTA_KB_URL, SANTA_KB_USER, SANTA_KB_PASS
photo = "IMG_2835.jpeg"
photo_focus = 48
wifi = "TP-Link con SIM"
climate = [{ source = "vaillant", label = "Riscaldamento" }]

[[property]]
id = "vassena"
label = "Vassena"
env = "VASSENA"    # secret: VASSENA_KB_URL, VASSENA_KB_USER, VASSENA_KB_PASS
photo = "aa1fb57d-0be3-4614-979a-58d019f97e33.jpeg"
photo_focus = 26   # la casa è nella parte alta della foto
# Le prenotazioni che il portale riporta con tutti gli importi a zero sono soggiorni
# nostri inseriti dal gestore, non ospiti: nel calendario valgono come date bloccate.
unpaid_is_own_use = true
wifi = "Eolo"
climate = [
  { source = "daikin", label = "Piano sopra" },
  { source = "airzone", label = "Piano sotto" },
]
# La barca è all'ormeggio: zero idrometrico di Malgrate (197,37 m s.l.m.).
lake = { name = "Lago di Como", attention_cm = 100, alarm_cm = 120 }
