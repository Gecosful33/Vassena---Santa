name: Aggiornamento notturno

# Legge i portali dei gestori, costruisce la pagina cifrata e la pubblica su GitHub Pages.
# Nessun dato viene scritto nel repository: la pagina è un artefatto di deploy. Le voci
# inserite dalla famiglia stanno, cifrate, nei commenti di una issue di questo repository.
#
# Questo repository è pubblico, quindi lo sono anche questi log. Il programma stampa solo
# l'esito per casa e il tipo di errore: mai contenuti delle pagine, indirizzi o credenziali.

on:
  schedule:
    # 02:17 UTC = 03:17 ora italiana in inverno, 04:17 in estate. Lontano dall'ora piena,
    # quando la coda dei job schedulati di GitHub è più carica e le partenze slittano.
    - cron: "17 2 * * *"
  workflow_dispatch:
  # Un periodo inserito dalla famiglia è un commento nel registro (la issue «Registro di
  # famiglia»): l'aggiornamento parte subito, così la segnalazione «Date da far bloccare al
  # gestore», e con lei la mail di GitHub al proprietario, non aspetta la notte.
  issue_comment:
    types: [created]

permissions: {}

jobs:
  sync:
    name: Leggi i portali e pubblica
    # Dei commenti contano solo quelli del registro, scritti con il token del proprietario:
    # il repository è pubblico, e un commento qualunque non deve poter avviare il job.
    # La richiesta «Aggiorna ora» della pagina non è una voce: quella la serve il pannello di controllo.
    if: >-
      github.event_name != 'issue_comment' || (
        !github.event.issue.pull_request &&
        github.event.issue.title == 'Registro di famiglia (dati cifrati: non modificare)' &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body != 'casecal-aggiorna-pannello'
      )
    # Sul job e non sul workflow: un'esecuzione che il filtro qui sopra salta non entra nel
    # gruppo. Il gruppo è lo stesso del pannello di controllo: i due non pubblicano mai insieme.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write      # deploy su GitHub Pages
      id-token: write   # richiesto da actions/deploy-pages
      actions: write    # solo per il passo "Mantieni attivo lo schedule"
      issues: write     # le segnalazioni al proprietario e lo stato del pannello di controllo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.redeployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Indirizzo del sito
        id: pages
        uses: actions/configure-pages@v6

      # Se un portale non risponde, la casa interessata conserva i dati della pagina già
      # online (SITE_URL) e la pagina lo segnala. Se non risponde nessuno il passo fallisce
      # e non si pubblica nulla: resta online la versione precedente.
      - name: Leggi i portali e costruisci la pagina
        id: sync
        env:
          # La password della pagina: una sola, apre calendario e conti.
          FAMILY_PASSPHRASE: ${{ secrets.FAMILY_PASSPHRASE }}
          SANTA_KB_URL: ${{ secrets.SANTA_KB_URL }}
          SANTA_KB_USER: ${{ secrets.SANTA_KB_USER }}
          SANTA_KB_PASS: ${{ secrets.SANTA_KB_PASS }}
          VASSENA_KB_URL: ${{ secrets.VASSENA_KB_URL }}
          VASSENA_KB_USER: ${{ secrets.VASSENA_KB_USER }}
          VASSENA_KB_PASS: ${{ secrets.VASSENA_KB_PASS }}
          # Facoltativi. FAMILY_LOG_TOKEN attiva «Chi usa la casa»: un token fine-grained
          # limitato alle Issues di questo repository (vedi README); senza, la pagina resta
          # in sola lettura. FAMILY_GROUPS elenca le famiglie proposte nel modulo, separate
          # da punto e virgola. OLD_FAMILY_PASSPHRASE serve per una sola esecuzione dopo
          # aver cambiato la password. OWNER_PASSPHRASE era la password dei soli conti:
          # ora serve soltanto, se c'è ancora, a rileggere una pagina pubblicata quando le
          # password erano due; dopo la prima esecuzione riuscita si può eliminare.
          FAMILY_LOG_TOKEN: ${{ secrets.FAMILY_LOG_TOKEN }}
          FAMILY_GROUPS: ${{ secrets.FAMILY_GROUPS }}
          OLD_FAMILY_PASSPHRASE: ${{ secrets.OLD_FAMILY_PASSPHRASE }}
          OWNER_PASSPHRASE: ${{ secrets.OWNER_PASSPHRASE }}
          # Facoltativi, tutti e tre insieme: accendono il P&L e le foto delle case. Il foglio
          # Excel delle spese e le foto stanno in un bucket privato di Cloudflare R2 (il
          # repository è pubblico: qui non possono stare); il job li scarica con una chiave
          # di sola lettura (vedi README, passi 7 e 8).
          COSTS_R2_URL: ${{ secrets.COSTS_R2_URL }}
          COSTS_R2_ACCESS_KEY_ID: ${{ secrets.COSTS_R2_ACCESS_KEY_ID }}
          COSTS_R2_SECRET_ACCESS_KEY: ${{ secrets.COSTS_R2_SECRET_ACCESS_KEY }}
          # Facoltativi: gli account delle app del clima, per il pannello di controllo (WiFi,
          # riscaldamento e raffrescamento; vedi README, passo 9). Una app senza i suoi secret
          # resta semplicemente «non collegata». Il livello del lago non ne richiede.
          AIRZONE_USER: ${{ secrets.AIRZONE_USER }}
          AIRZONE_PASS: ${{ secrets.AIRZONE_PASS }}
          VAILLANT_USER: ${{ secrets.VAILLANT_USER }}
          VAILLANT_PASS: ${{ secrets.VAILLANT_PASS }}
          VAILLANT_COUNTRY: ${{ secrets.VAILLANT_COUNTRY }}
          DAIKIN_CLIENT_ID: ${{ secrets.DAIKIN_CLIENT_ID }}
          DAIKIN_CLIENT_SECRET: ${{ secrets.DAIKIN_CLIENT_SECRET }}
          DAIKIN_REFRESH_TOKEN: ${{ secrets.DAIKIN_REFRESH_TOKEN }}
          # Il token del workflow stesso: apre e commenta la segnalazione per il proprietario.
          # Deve scriverla GitHub Actions, non il proprietario: nessuno riceve notifiche di
          # ciò che fa da sé.
          ALERTS_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m casecal sync --out dist

      - name: Carica la pagina
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Capita che l'artefatto appena caricato non sia ancora visibile a chi lo pubblica
      # («No artifacts named "github-pages" were found»): si aspetta un momento e si
      # riprova una volta, prima di dare la pubblicazione per fallita.
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Attendi prima di riprovare
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Pubblica (secondo tentativo)
        id: redeployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # GitHub disattiva i workflow schedulati dei repository pubblici dopo 60 giorni senza
      # attività, e questo job non fa commit. Riabilitarsi a ogni esecuzione azzera il conteggio.
      - name: Mantieni attivo lo schedule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/enable" \
            || echo "::warning::Impossibile rinnovare lo schedule: controlla che il workflow resti abilitato."

      # La pagina è già online con quello che si è potuto leggere; il job fallisce comunque,
      # così GitHub manda la notifica e qualcuno guarda il portale che ha dato problemi.
      - name: Segnala l'aggiornamento parziale
        if: steps.sync.outputs.degraded == 'true'
        run: |
          echo "::error::Aggiornamento parziale: almeno una casa richiede attenzione (vedi gli avvisi del passo di lettura)."
          exit 1
