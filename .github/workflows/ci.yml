name: Test

# Nessun secret qui: i test girano su pagine sintetiche, mai sui portali veri.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Test Python
        run: python -m pytest

      # Verifica anche che la pagina (WebCrypto) apra ciò che Python ha cifrato.
      - name: Test JavaScript
        run: node --test tests/js/*.test.js

      - name: La pagina dimostrativa si costruisce
        run: python -m casecal demo --out dist-demo
